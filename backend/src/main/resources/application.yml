spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/canteen_management}
    username: ${DB_USERNAME:canteen_app}
    password: ${DB_PASSWORD:canteen_app}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8081
